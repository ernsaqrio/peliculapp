name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Remove previous container
        run: docker rm -f peliculapp-test || true

      - name: Run container
        run: |
          docker run -d \
            --name peliculapp-test \
            -p 8000:8000 \
            -e APP_ENV=production \
            -e APP_DEBUG=true \
            -e APP_KEY="${{ secrets.APP_KEY }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            $IMAGE_NAME:${{ github.sha }}

      - name: Show container status
        run: |
          docker ps -a

      - name: Wait for application startup
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/health || true)

            if [ "$STATUS" = "200" ]; then
              echo "Application started successfully"
              exit 0
            fi

            echo "Waiting for application... ($i/20)"
            sleep 2
          done

          echo "Application failed to start"

          echo "===== CONTAINER LOGS ====="
          docker logs peliculapp-test || true

          exit 1

      - name: Smoke Test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:8000/api/health)

          echo "Status: $STATUS"

          if [ "$STATUS" != "200" ]; then

            echo "===== CONTAINER LOGS ====="
            docker logs peliculapp-test || true

            echo "===== LARAVEL LOGS ====="
            docker exec peliculapp-test sh -c "cat storage/logs/*.log" || true

            exit 1
          fi

      - name: Push image to GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest