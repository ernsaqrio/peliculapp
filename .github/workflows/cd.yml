name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:

  docker-publish:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Remove previous container (if exists)
        run: docker rm -f peliculapp-test || true

      - name: Run container
        run: |
          docker run -d \
            --name peliculapp-test \
            -p 8000:8000 \
            -e APP_ENV=testing \
            -e APP_DEBUG=true \
            -e APP_KEY="${{ secrets.APP_KEY }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            $IMAGE_NAME:${{ github.sha }}

      - name: Wait for app (robust healthcheck)
        run: |
          for i in {1..15}; do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done

          echo "App failed to start"
          docker logs peliculapp-test || true
          exit 1

      - name: Smoke Test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000)

          echo "Status: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            docker logs peliculapp-test || true
            exit 1
          fi

      - name: Push image to GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest